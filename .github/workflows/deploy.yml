name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Compute site URL and base path
        id: site
        run: |
          REPO_NAME="${{ github.event.repository.name }}"
          OWNER="${{ github.repository_owner }}"
          if [ "$REPO_NAME" = "${OWNER}.github.io" ]; then
            echo "site_url=https://${OWNER}.github.io" >> "$GITHUB_OUTPUT"
            echo "base_path=/" >> "$GITHUB_OUTPUT"
          else
            echo "site_url=https://${OWNER}.github.io" >> "$GITHUB_OUTPUT"
            echo "base_path=/${REPO_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        env:
          SITE_URL: ${{ vars.SITE_URL || steps.site.outputs.site_url }}
          BASE_PATH: ${{ vars.BASE_PATH || steps.site.outputs.base_path }}
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
